[project]
name = "generator-new-generation"
version = "0.1.0"
description = "Windows GUI application for generating raw laboratory data for sensors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neurokit2>=0.2.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyQt6==6.8.1",
    "PyQt6-Qt6==6.8.2",
    "PyQt6-sip==13.13.0",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
